<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gianmarco Palazzo — Geensang</title>
  <meta name="description" content="Gianmarco Palazzo — Photographer \ Videographer based in Italy">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro is-loading">

  <!-- Preloader -->
  <div class="loader" id="loader" aria-hidden="true">
    <span class="loader-label">Loading tape</span>
    <span class="loader-count" id="loaderCount">000</span>
    <span class="loader-bar"><span id="loaderBar"></span></span>
  </div>

  <!-- Sfondo -->
  <div class="intro-bg" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- HUD videocamera -->
  <div class="hud" aria-hidden="true">
    <div class="hud-corner tl"><span class="rec-dot"></span>REC</div>
    <div class="hud-corner tr" id="timecode">00:00:00:00</div>
    <div class="hud-corner bl">PLAY ▶ SP<br><span id="hudDate"></span></div>
    <div class="hud-corner br">IT ◉ 37°N<br>CH 03</div>
    <span class="frame-mark f1"></span><span class="frame-mark f2"></span>
    <span class="frame-mark f3"></span><span class="frame-mark f4"></span>
  </div>

  <main class="intro-content">
    <p class="intro-kicker reveal-up">Portfolio — Vol. 2026</p>

    <h1 class="intro-title" aria-label="Gianmarco Palazzo">
      <span class="line"><span class="split glitch" data-text="GIANMARCO">GIANMARCO</span></span>
      <span class="line"><span class="split glitch" data-text="PALAZZO">PALAZZO</span></span>
    </h1>

    <p class="intro-subtitle reveal-up">Photographer \ Videographer <span class="sep">—</span> Based in Italy</p>

    <a href="home.html" class="btn-enter reveal-up" id="enter" data-cursor="Play">
      <span class="btn-enter-text" data-hover="Entra →">Entra</span>
    </a>

    <ul class="social reveal-up">
      <li><a href="https://www.instagram.com/geensang/" target="_blank" rel="noopener" data-cursor="IG">Instagram</a></li>
      <li><a href="https://www.linkedin.com/in/gianmarco-palazzo-12b05627b/" target="_blank" rel="noopener" data-cursor="IN">LinkedIn</a></li>
      <li><a href="mailto:tonicwaee@gmail.com" data-cursor="Mail">Email</a></li>
    </ul>
  </main>

  <!-- Transizione -->
  <div class="shutter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

  <div class="cursor" aria-hidden="true"><span class="cursor-label"></span></div>

  <script src="script.js"></script>
</body>
</html>
